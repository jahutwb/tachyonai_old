<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TachyonAI - Podsumowanie Sesji</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Lokalne style dla strony podsumowania */
        .stats-row {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }
        
        .stat-card {
            flex: 1;
            min-width: 120px;
            text-align: center;
            padding: 10px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .stat-card:last-child {
            border-right: none;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 14px;
            color: var(--text-color-secondary);
        }
        
        .chart-section {
            margin: 25px 0;
        }
        
        .chart-container {
            height: 300px;
            width: 100%;
            margin: 0 auto;
        }
        
        .horizontal-ranking {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 15px;
            padding: 10px 0;
            margin-bottom: 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-color) var(--bg-color-light);
        }
        
        .horizontal-ranking::-webkit-scrollbar {
            height: 8px;
        }
        
        .horizontal-ranking::-webkit-scrollbar-thumb {
            background-color: var(--accent-color);
            border-radius: 4px;
        }
        
        .horizontal-ranking::-webkit-scrollbar-track {
            background-color: var(--bg-color-light);
        }
        
        .stimulus-card {
            flex: 0 0 auto;
            width: 200px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
            transition: transform 0.2s;
        }
        
        .stimulus-card:hover {
            transform: translateY(-5px);
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .stimulus-image {
            width: 100%;
            height: 120px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .stimulus-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .stimulus-details {
            font-size: 14px;
        }
        
        .stimulus-details div {
            margin-bottom: 5px;
        }
        
        .stimulus-id {
            font-weight: bold;
            color: var(--accent-color);
        }
        
        .stimulus-success {
            color: #4CAF50;
        }
        
        .stimulus-profit {
            color: #FFC107;
        }
        
        .pool-stats-table {
            width: 100%;
            margin: 20px 0;
            text-align: center;
            border-collapse: collapse;
        }
        
        .pool-stats-table th {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 12px;
            font-size: 16px;
            color: var(--accent-color);
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        .pool-stats-table td {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .pool-stats-table tr:last-child td {
            border-bottom: none;
        }
        
        .pool-stats-info {
            text-align: center;
            margin: 20px 0;
            font-size: 14px;
            color: var(--text-color-secondary);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-logo">
            <a href="/">TachyonAI</a>
        </div>
        <div class="navbar-menu">
            <a href="/" class="navbar-item">Strona Startowa</a>
            <a href="/stats" class="navbar-item">Statystyki Użytkownika</a>
            <div class="navbar-auth">
                <span id="username-display"></span>
                <button id="logout-button" class="button">Wyloguj</button>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="summary-container" style="width: 100%; max-width: 1200px;">
            <h1>Podsumowanie Sesji</h1>
            
            <!-- Statystyki sesji - poziomy układ -->
            <div class="summary-section">
                <h2>Statystyki Sesji</h2>
                <div class="stats-row">
                    <div class="stat-card">
                        <div id="session-successes" class="stat-value">0</div>
                        <div class="stat-label">Sukcesów</div>
                    </div>
                    <div class="stat-card">
                        <div id="session-failures" class="stat-value">0</div>
                        <div class="stat-label">Porażek</div>
                    </div>
                    <div class="stat-card">
                        <div id="session-difference" class="stat-value">0</div>
                        <div class="stat-label">Różnica</div>
                    </div>
                    <div class="stat-card">
                        <div id="session-success-rate" class="stat-value">0%</div>
                        <div class="stat-label">Skuteczność</div>
                    </div>
                    <div class="stat-card">
                        <div id="session-profit" class="stat-value">0%</div>
                        <div class="stat-label">Zysk</div>
                    </div>
                </div>
            </div>
            
            <!-- Szerszy wykres przebiegu bogactwa -->
            <div class="summary-section chart-section">
                <h2>Przebieg Bogactwa</h2>
                <div class="chart-container">
                    <canvas id="wealth-chart"></canvas>
                </div>
            </div>
            
            <!-- Poziomy ranking bodźców pozytywnych -->
            <div class="summary-section">
                <h2>Ranking Bodźców Pozytywnych</h2>
                <div id="positive-stimulus-ranking" class="horizontal-ranking">
                    <!-- Tutaj będą dodawane elementy rankingu -->
                </div>
            </div>
            
            <!-- Sekcja szczegółów rund -->
            <div class="summary-section">
                <button id="show-details-button" class="button secondary-button">Szczegółowy przebieg rund</button>
                <div id="rounds-details" class="details-container" style="display: none;">
                    <table id="rounds-table" class="details-table" style="width: 100%;">
                        <thead>
                            <tr>
                                <th>Nr</th>
                                <th>Data/Czas</th>
                                <th>Obraz + ID</th>
                                <th>Obraz - ID</th>
                                <th>Wybór</th>
                                <th>Zmiana %</th>
                                <th>Wynik</th>
                            </tr>
                        </thead>
                        <tbody id="rounds-table-body"></tbody>
                    </table>
                </div>
            </div>

            <!-- Sekcja przycisku "Nowa sesja" -->
            <div class="summary-actions">
                <button id="new-session-button" class="button primary-button">Nowa sesja</button>
            </div>

            <!-- Sekcja statystyk puli -->
            <div id="summary-content" class="summary-section">
                <!-- Tu zostaną dodane statystyki puli -->
            </div>

        </div>
    </main>

    <div id="loading-overlay" class="overlay" style="display: none;">
        <div class="spinner"></div>
        <p id="loading-message">Generowanie nowej sesji...</p>
    </div>

    <script src="{{ url_for('static', path='/js/auth.js') }}"></script>
    <script src="{{ url_for('static', path='/js/summary.js') }}"></script>
</body>
</html>
